name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: snmp-tui-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: snmp-tui-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: snmp-tui-macos-intel
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: snmp-tui-macos-apple-silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-dev
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/aarch64-linux-musl-gcc
          echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binary
        run: cargo build --release -p snmp-tui --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/snmp-tui dist/
          cd dist
          tar czf ${{ matrix.artifact }}.tar.gz snmp-tui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --generate-notes \
            artifacts/*.tar.gz

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums and version
        id: meta
        run: |
          INTEL_SHA=$(sha256sum artifacts/snmp-tui-macos-intel.tar.gz | awk '{print $1}')
          ARM_SHA=$(sha256sum artifacts/snmp-tui-macos-apple-silicon.tar.gz | awk '{print $1}')
          VERSION="${GITHUB_REF_NAME#v}"
          echo "intel_sha=$INTEL_SHA" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TOKEN}@github.com/MatrixDai/homebrew-tap.git
          cd homebrew-tap

          VERSION="${{ steps.meta.outputs.version }}"
          INTEL_SHA="${{ steps.meta.outputs.intel_sha }}"
          ARM_SHA="${{ steps.meta.outputs.arm_sha }}"

          python3 - <<'EOF'
          import re, os
          version = os.environ['VERSION']
          intel_sha = os.environ['INTEL_SHA']
          arm_sha = os.environ['ARM_SHA']

          with open('Formula/snmp-tui.rb') as f:
              content = f.read()

          content = re.sub(r'version "[^"]+"', f'version "{version}"', content)

          shas = [intel_sha, arm_sha]
          idx = [0]
          def replacer(m):
              i = idx[0]; idx[0] += 1
              return f'sha256 "{shas[i]}"'
          content = re.sub(r'sha256 "[a-f0-9]+"', replacer, content)

          with open('Formula/snmp-tui.rb', 'w') as f:
              f.write(content)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/snmp-tui.rb
          git commit -m "Update snmp-tui to ${VERSION}"
          git push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          INTEL_SHA: ${{ steps.meta.outputs.intel_sha }}
          ARM_SHA: ${{ steps.meta.outputs.arm_sha }}

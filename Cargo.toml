[workspace]
members = [
    "crates/mib-parser",
    "crates/snmp-client",
    "crates/snmp-cat",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Parser
pest = "2"
pest_derive = "2"

# SNMP
snmp2 = { version = "0.5", features = ["v3", "heap_buffers"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# TUI
ratatui = "0.30"
crossterm = "0.28"

# CLI & Config
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
thiserror = "2"

# Clipboard
arboard = "3"

# Workspace crates
mib-parser = { path = "crates/mib-parser" }
snmp-client = { path = "crates/snmp-client" }
